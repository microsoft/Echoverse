[project]
name = "echoforge-app"
version = "0.1.0"
description = "EchoForge app with React frontend and FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.14",
    "requests>=2.31.0",
    "python-multipart>=0.0.22",
]

[project.scripts]
echoforge = "backend.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
